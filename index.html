<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
    <header>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Log spending in any currency, see it in one.</p>
    </header>
 
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
 
    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add expense</h2>
      <form id="expense-form" class="form-grid">
        <label>Description
          <input id="description" type="text" required maxlength="80" placeholder="e.g. Taxi to airport">
        </label>
        <label>Amount
          <input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
        </label>
        <label>Currency
          <select id="currency"></select>
        </label>
        <label>Category
          <select id="category"></select>
        </label>
        <button type="submit" class="primary">Add</button>
      </form>
    </section>
     <section class="card" aria-labelledby="list-heading">
      <div class="toolbar">
        <h2 id="list-heading">Expenses</h2>
        <label>Filter
          <select id="filter"></select>
        </label>
        <label>Home currency
          <select id="home-currency"></select>
        </label>
      </div>
 
      <p id="empty" class="empty">No expenses yet. Add your first one above.</p>
      <ul id="expense-list" class="expense-list"></ul>
 
      <div class="total-row">
        <span>Total</span>
        <strong id="total">0.00</strong>
      </div>
      <p id="total-warning" class="warning" role="status"></p>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
